# Dependabot's own pull requests, merged once the gate is green. The job lives
# in ChiefGyk3D/git-your-ship-together; this file only says that it applies
# here. A major bump is still left for a person.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/dependabot-auto-merge.yml@34536f91c5207effb397d065e6bb98cc348c6e2b # v1.5.0
    permissions:
      contents: write  # enable auto-merge on the pull request
      pull-requests: write  # read its Dependabot metadata
