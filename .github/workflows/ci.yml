# Lint, tests on Python 3.10-3.14 with coverage, Docker build. The jobs live in
# ChiefGyk3D/git-your-ship-together; this file only says what is specific to
# Stream Daemon.
name: CI

on:
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@d57b0b6b08b84c68b5c33d5198e83eed8030c455 # v1.1.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC: CODECOV_TOKEN
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.14"
      lint-python-version: "3.14"
      install-command: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -r requirements.txt
      test-command: pytest tests/ -v --cov=stream_daemon --cov-report=xml --cov-report=term
      codecov: true
      lint-command: ruff check stream_daemon/ stream-daemon.py --output-format=github
      dockerfile: Docker/Dockerfile
      docker-test-command: docker run --rm "$IMAGE" python -c "import stream_daemon; print('Import successful')"
      doppler-project: stream-daemon
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
